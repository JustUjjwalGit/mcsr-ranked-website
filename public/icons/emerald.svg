  <!-- Top facet -->
  <polygon points="8,1 13,5 8,4 3,5" fill="#00e060"/>
  <!-- Left facet -->
  <polygon points="3,5 8,4 8,9 3,11" fill="#009a3c"/>
  <!-- Right facet -->
