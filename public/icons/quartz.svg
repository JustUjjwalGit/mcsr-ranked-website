<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" style="image-rendering:pixelated">
  <!-- Quartz crystal shard -->
  <polygon points="6,1 10,1 13,6 8,15 3,6" fill="#f0ece4"/>
  <!-- Top highlight facet -->
  <polygon points="6,1 10,1 8,5" fill="#ffffff"/>
  <!-- Left facet -->
  <polygon points="6,1 8,5 3,6" fill="#d8d4cc"/>
  <!-- Right facet -->
  <polygon points="10,1 13,6 8,5" fill="#e8e4dc"/>
  <!-- Lower left -->
  <polygon points="3,6 8,5 8,15" fill="#c4c0b8"/>
  <!-- Lower right -->
  <polygon points="8,5 13,6 8,15" fill="#a8a49c"/>
  <!-- Shine -->
  <rect x="7" y="3" width="1" height="2" fill="#ffffff"/>
</svg>
