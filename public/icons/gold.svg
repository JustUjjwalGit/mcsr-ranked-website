<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" style="image-rendering:pixelated">
  <!-- Gold ingot body -->
  <rect x="1" y="3" width="14" height="10" fill="#f5c400"/>
  <!-- Top highlight -->
  <rect x="1" y="3" width="14" height="2" fill="#ffe566"/>
  <!-- Left highlight -->
  <rect x="1" y="3" width="2" height="10" fill="#ffe566"/>
  <!-- Right shadow -->
  <rect x="13" y="5" width="2" height="8" fill="#9a8000"/>
  <!-- Bottom shadow -->
  <rect x="1" y="11" width="14" height="2" fill="#9a8000"/>
  <!-- Center detail -->
  <rect x="4" y="6" width="7" height="4" fill="#ffd020"/>
  <!-- Shine pixels (makes it look extra shiny / gold) -->
  <rect x="5" y="6" width="2" height="1" fill="#fff5a0"/>
  <rect x="6" y="8" width="1" height="1" fill="#fff0a0"/>
</svg>
